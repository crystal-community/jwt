name: jwt
version: 1.8.0

authors:
  - Potapov Sergey <blake131313@gmail.com>
  - Stephen von Takach <steve@vontaka.ch>

dependencies:
  openssl_ext:
    github: spider-gazelle/openssl_ext
    version: ~> 2.6

  bindata:
    github: spider-gazelle/bindata
    version: ">= 2.1"

  ed25519:
    github: spider-gazelle/ed25519
    version: ~> 1.1

development_dependencies:
  ameba:
    github: veelenga/ameba

  webmock:
    github: manastech/webmock.cr
    branch: master

  # optional, for `require "jwt/jwks_proxy"`
  connect-proxy:
    github: spider-gazelle/connect-proxy
    version: ~> 2.0

